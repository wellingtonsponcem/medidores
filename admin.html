<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Admin — Calculadora de Consumo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
    .nav-btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 600; transition: background 0.2s; }
    .nav-btn.active { background: #4f46e5; color: white; }
    .nav-btn:not(.active) { background: #e2e8f0; color: #475569; }
    .nav-btn:not(.active):hover { background: #cbd5e1; }
    .table-container { overflow-x: auto; background: white; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th { background: #f1f5f9; padding: 0.75rem 1rem; text-align: left; font-size: 0.875rem; border-bottom: 2px solid #e2e8f0; }
    td { padding: 0.75rem 1rem; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    tr:hover { background: #f8fafc; }
    .edit-input { border: 1px solid #cbd5e1; border-radius: 0.25rem; padding: 0.25rem; width: 80px; }
    .edit-input.date-input { width: 130px; }
    .btn-action { padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
    .btn-edit { background: #e0f2fe; color: #0284c7; }
    .btn-edit:hover { background: #bae6fd; }
    .btn-save { background: #dcfce7; color: #16a34a; }
    .btn-save:hover { background: #bbf7d0; }
    .btn-delete { background: #fee2e2; color: #dc2626; margin-left: 0.5rem; }
    .btn-delete:hover { background: #fecaca; }
  </style>
</head>
<body class="p-4 md:p-8 bg-slate-50 text-slate-800" id="admin-body">

  <div id="admin-dashboard" class="max-w-6xl mx-auto">
    <header class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl font-bold text-slate-800">Painel do Administrador</h1>
        <p class="text-slate-500">Gerencie todos os testes e leituras registrados</p>
      </div>
      <a href="index.html" class="text-indigo-600 hover:text-indigo-800 font-semibold">&larr; Voltar ao Início</a>
    </header>

    <div class="flex gap-4 mb-6">
      <button id="tab-agua" class="nav-btn active">Água</button>
      <button id="tab-energia" class="nav-btn">Energia</button>
    </div>

    <!-- Tabela de Água -->
    <div id="view-agua" class="table-container">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Cesan (Leitura)</th>
            <th>H1 (Leitura)</th>
            <th>H2 (Leitura)</th>
            <th>H3 (Leitura)</th>
            <th>Valor Fatura</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tbody-agua">
          <tr><td colspan="7" class="text-center py-4">Carregando...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Tabela de Energia -->
    <div id="view-energia" class="table-container hidden">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Leitura Padrão</th>
            <th>Leitura Interna</th>
            <th>Valor Fatura</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tbody-energia">
          <tr><td colspan="5" class="text-center py-4">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js?v=new888"></script>
</body>
</html>
